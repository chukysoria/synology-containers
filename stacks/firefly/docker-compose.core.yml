services:
  app:
    image: fireflyiii/core:version-6.7.9@sha256:a2b53539338d1cd04d341b229c3806cb178cf64c72459060e3ed34bec4167bd8
    hostname: app
    container_name: firefly_iii_core
    networks:
      - firefly-net
      - firefly-frontend-net
      - firefly-db-net
      - nodered-backend-net
    restart: always
    env_file:
      - ../../stack.env
    volumes:
      - firefly_iii_upload:/var/www/html/storage/upload
    labels:
      traefik.enable: true
      traefik.docker.network: firefly-frontend-net
      traefik.http.routers.fireflyiii-rtr.rule: Host(`firefly.${DOMAIN:-boulebar.duckdns.org}`)
      traefik.http.routers.fireflyiii-rtr.middlewares: authentik@docker

  firefly-pico:
    image: cioraneanu/firefly-pico:dev@sha256:abfaa7fee13d85025cbf02f68bd0551cdeebe9a3964cf85c9ae6bfe7ec2244b3
    container_name: firefly_pico
    environment:
      - FIREFLY_URL=http://app:8080
      - DB_CONNECTION=pgsql
      - DB_HOST=timescaledb
      - DB_PORT=5432
      - DB_DATABASE=firefly-pico
      - DB_USERNAME=firefly-pico
      - DB_PASSWORD=${PG_PICO_PASS:?Firefly Pico DB Password}
      - TZ=${TZ:-Europe/Madrid}
      - NGINX_PORT=8080
    networks:
      - firefly-net
      - firefly-frontend-net
      - firefly-db-net
    depends_on:
      - app
    labels:
      traefik.enable: true
      traefik.docker.network: firefly-frontend-net
      traefik.http.routers.firefly-pico-rtr.rule: Host(`ffpico.${DOMAIN:-boulebar.duckdns.org}`)
      traefik.http.services.firefly-pico-svc.loadbalancer.server.port: 8080

  cron:
    image: ghcr.io/chukysoria/baseimage-alpine:v1.0.10-3.23@sha256:33ee81d06c76048e3ac4d23e6cc319d05d82084f846eb39a9a40c66f77afba89
    networks:
      - firefly-net
    restart: unless-stopped
    environment:
      # General LinuxServer.io
      PUID: ${PUID:-1029}
      PGID: ${PGID:-65536}
      TZ: ${TZ:-Europe/Madrid}
      DOCKER_MODS: "linuxserver/mods:universal-cron|linuxserver/mods:universal-package-install|ghcr.io/chukysoria/tailscale-mod:v1.1.5"
      INSTALL_PIP_PACKAGES: ${INSTALL_PIP_PACKAGES:-}
      INSTALL_PACKAGES: ${INSTALL_PACKAGES:-}
      # Tailscale
      TAILSCALE_AUTHKEY: ${TAILSCALE_AUTHKEY:?Tailscale Authorization key}
      TAILSCALE_USE_SSH: 1
      TAILSCALE_STATE_DIR: /tsconfig
      TAILSCALE_HOSTNAME: firefly-cron
    volumes:
      - ${BASE_PATH:-/volume2/docker/}firefly/cron:/config/crontabs:rw
      - ts_ff_cron:/tsconfig

volumes:
   firefly_iii_upload:
   ts_ff_cron:

networks:
  firefly-net:
    external: true # Defined in base
  firefly-frontend-net:
    external: true # Defined in base
  firefly-db-net:
    external: true # Defined in base
  nodered-backend-net:
    external: true # Defined in base
