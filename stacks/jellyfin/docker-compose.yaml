---
volumes:
  ts_jellyfin:

services:
  jellyfin:
    image: lscr.io/linuxserver/jellyfin:12.2ubu2604-ls54@sha256:799509f8ef3be7037478699cc6fd14d19dd75faac5e474ed219e98ae78a5b3e4
    environment:
      # General LinuxServer.io
      PUID: ${PUID:-1029}
      PGID: ${PGID:-65536}
      TZ: ${TZ:-Europe/Madrid}
      DOCKER_MODS: "ghcr.io/chukysoria/tailscale-mod:v1.1.5"
      # Tailscale
      TAILSCALE_AUTHKEY: ${TAILSCALE_AUTHKEY:?Tailscale Authorization key}
      TAILSCALE_SERVE_MODE: https
      TAILSCALE_USE_SSH: 1
      TAILSCALE_STATE_DIR: /tsconfig
      TAILSCALE_HOSTNAME: jellyfin
      TAILSCALE_SERVE_PORT: 8096
      # Jellyfin
      JELLYFIN_PublishedServerUrl: "https://jellyfin.${DOMAIN:-boulebar.duckdns.org}"
    networks:
      - frontend
    volumes:
      - ts_jellyfin:/tsconfig
      - ${BASE_PATH:-/volume2/docker/}jellyfin:/config:rw
      - /volume2/music:/media/music
      - /volume2/video:/media/video
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 2m
    labels:
      traefik.enable: true
      # Routers
      traefik.http.routers.jellyfin-rtr.rule: Host(`jellyfin.${DOMAIN:-boulebar.duckdns.org}`)
      traefik.http.routers.jellyfin-rtr.service: jellyfin-svc
      
      traefik.udp.routers.jellyfin-udp-rtr.entrypoints: jellyfin_locate
      traefik.udp.routers.jellyfin-udp-rtr.service: jellyfin-udp-svc

      # Services
      traefik.http.services.jellyfin-svc.loadbalancer.server.port: 8096
      traefik.udp.services.jellyfin-udp-svc.loadbalancer.server.port: 7359

  seerr:
    image: ghcr.io/seerr-team/seerr:v3.5.1@sha256:d8fab675b55ad293ded98fd71efcfd46054cbad9746534ae1cc4794a88c0b3be
    init: true
    container_name: seerr
    user: ${PUID:-1029}:${PGID:-65536} # Seerr ignores PUID/PGID
    environment:
      TZ: ${TZ:-Europe/Madrid}
    volumes:
      - ${BASE_PATH:-/volume2/docker/}jellyseerr:/app/config
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "5055"]
      interval: 30s
      timeout: 30s
      retries: 5
      start_period: 2m
      # start_interval: 5s
    labels:
      traefik.enable: true
      traefik.http.routers.seerr-rtr.rule: Host(`seerr.${DOMAIN:-boulebar.duckdns.org}`)    
    restart: unless-stopped

networks:
  frontend:
    external: true # Defined in base
