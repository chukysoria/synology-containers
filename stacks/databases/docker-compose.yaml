---
services:
  timescale-db:
    image: timescale/timescaledb-ha:pg18-ts2.31@sha256:ad8b5095c9e9f19b3c97794133f1dd80f09da9566a5687f79b6208324b98a388
    container_name: timescaledb
    restart: unless-stopped    
    volumes:
      - ${BASE_PATH:-/volume2/docker/}databases/timescaledb-pg18:/home/postgres/pgdata/data
    networks:
      database:
        ipv4_address: 172.19.0.4
      grafana-db-net:
      authentik-db-net:
      firefly-db-net:
      ghostfolio-db-net:
    # ports:
    #   - 5433:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 5s
    environment:
      TZ: ${TZ:-Europe/Madrid}
      POSTGRES_USER: ${TS_USER:-postgres}
      POSTGRES_PASSWORD: ${TS_PASS:?database password required}
      POSTGRES_DB: ${TS_DB:-homeassistant}      

  redis:
    image: redis:8.10.3-alpine@sha256:21090af93f8324db2f0f0f4f38a7c60369d47d917e000c3423d89d2ae2883537
    container_name: redis
    command: --save 60 1 --loglevel warning
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      start_period: 20s
      interval: 30s
      retries: 5
      timeout: 3s
    volumes:
      - ${BASE_PATH:-/volume2/docker/}databases/redis:/data:uid=${PUID:-1029},gid=${PGID:-65536}
    networks:
      - database
      - firefly-db-net
      - ghostfolio-db-net

  # Daily logical dump of the whole cluster (pg_dumpall) so Hyper Backup captures a consistent copy
  # instead of the live data directory. Restore with: gunzip -c <file> | psql -U <user> postgres
  # Note: TimescaleDB hypertables need timescaledb_pre_restore()/post_restore() when restoring.
  timescale-db-backup:
    image: prodrigestivill/postgres-backup-local:18-alpine@sha256:5519b121b9f3058dc6f116927f8131a6f67951542dbf2cdacfd193f42daaa7a3
    user: ${PUID:-1029}:${PGID:-65536}
    restart: unless-stopped
    depends_on:
      timescale-db:
        condition: service_healthy
    networks:
      - database
    volumes:
      - ${BASE_PATH:-/volume2/docker/}backups/timescaledb:/backups
    environment:
      TZ: ${TZ:-Europe/Madrid}
      POSTGRES_HOST: timescaledb
      POSTGRES_DB: ${TS_DB:-homeassistant}
      POSTGRES_USER: ${TS_USER:-postgres}
      POSTGRES_PASSWORD: ${TS_PASS:?database password required}
      POSTGRES_CLUSTER: "TRUE"
      # Image default is -Z1, which pg_dumpall rejects; output is gzipped by the script anyway
      POSTGRES_EXTRA_OPTS: ""
      SCHEDULE: "0 0 2 * * *"
      BACKUP_ON_START: "TRUE"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 3
    security_opt:
      - no-new-privileges:true

  pgadmin:
    image: dpage/pgadmin4:9.19@sha256:3591b3d02910dcd817dec6fcaa681c278ba6966945283dd0ea0042731c330c83
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_USER:-user@domain.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGAdmin password required}
    volumes:
      - pgadmin:/var/lib/pgadmin
      - ${BASE_PATH:-/volume2/docker/}databases/pgadmin/config_local.py:/pgadmin4/config_local.py
    networks:
      - frontend
      - database
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-O", "-", "http://localhost:80/misc/ping"]
      start_period: 2m
      interval: 30s
      retries: 5
      timeout: 3s
      # start_interval: 5s
    labels:
      traefik.enable: true
      traefik.docker.network: frontend
      traefik.http.routers.pgadmin-rtr.rule: Host(`pgadmin.${DOMAIN:-boulebar.duckdns.org}`)

volumes:
  pgadmin:

networks:
  database:
    name: database
    ipam:
      driver: default
      config:
        - subnet: 172.19.0.0/24
          gateway: 172.19.0.1
  authentik-db-net:
    external: true
  grafana-db-net:
    external: true
  firefly-db-net:
    external: true
  ghostfolio-db-net:
    external: true
  frontend:
    external: true # Defined in portainer
