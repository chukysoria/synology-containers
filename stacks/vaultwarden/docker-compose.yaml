---
volumes:
  ts_vaultwarden:

services:
  vaultwarden:
    image: ghcr.io/chukysoria/vaultwarden:v0.5.62@sha256:20067ab4c38ec9925bbbcf0fd70a17f769446a255be9bcd394f2037141fb8c34
    networks:
      - frontend
    volumes:
      - ts_vaultwarden:/tsconfig
      - ${BASE_PATH:-/volume2/docker/}vaultwarden:/app/vw/data:rw
    environment:
      # General LinuServer.io
      PUID: ${PUID:-1029}
      PGID: ${PGID:-65536}
      TZ: ${TZ:-Europe/Madrid}
      DOCKER_MODS: ghcr.io/chukysoria/tailscale-mod:v1.1.5
      # Tailscale
      TAILSCALE_AUTHKEY: ${TAILSCALE_AUTHKEY:?Tailscale Authorization key}
      TAILSCALE_SERVE_MODE: https
      TAILSCALE_FUNNEL: 1
      TAILSCALE_USE_SSH: 1
      TAILSCALE_STATE_DIR: /tsconfig
      TAILSCALE_HOSTNAME: vw
      TAILSCALE_SERVE_PORT: 7979
      # Vaultwarden
      ROCKET_PORT: 7979
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vaultwarden.rule=Host(`vw.${DOMAIN:-boulebar.duckdns.org}`)"
    restart: unless-stopped

  # Consistent SQLite backup (sqlite3 .backup) plus attachments/sends/keys, so Hyper Backup
  # doesn't have to copy the live db.sqlite3 + WAL.
  vaultwarden-backup:
    image: bruceforce/vaultwarden-backup:2.1.6@sha256:3e464a652874b9575c8a8687cf5504d78ce47b6592e63d50dd32e1c5c882e319
    network_mode: none
    restart: unless-stopped
    depends_on:
      - vaultwarden
    volumes:
      - ${BASE_PATH:-/volume2/docker/}vaultwarden:/data:rw # rw needed: SQLite WAL needs the -shm file
      - ${BASE_PATH:-/volume2/docker/}backups/vaultwarden:/backup
    environment:
      TZ: ${TZ:-Europe/Madrid}
      UID: ${PUID:-1029}
      GID: ${PGID:-65536}
      CRON_TIME: "0 2 * * *"
      DELETE_AFTER: 30
      TIMESTAMP: "true"
      BACKUP_ADD_SENDS: "true"
    security_opt:
      - no-new-privileges:true

networks:
  frontend:
    external: true # Defined in Portainer
